  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    ports:
      - 11434:11434
    volumes:
      - /volume/ollama/models:/root/.ollama


  dst1-postgres:
    image: pgvector/pgvector:pg16
    container_name: dst1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DST1_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DST1_POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${DST1_POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - /volume/dst1-postgres:/var/lib/postgresql/data
      - /etc/docker/build/dst1-postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DST1_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dst1-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dst1-n8n
    restart: unless-stopped
    depends_on:
      dst1-postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      - N8N_LOG_LEVEL=debug
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
#      - DB_TYPE=postgresdb
#      - DB_POSTGRESDB_HOST=${DST1_DB_POSTGRESDB_HOST}
#      - DB_POSTGRESDB_PORT=5432
#      - DB_POSTGRESDB_DATABASE=n8n
#      - DB_POSTGRESDB_USER=${DST1_POSTGRES_USER}
#      - DB_POSTGRESDB_PASSWORD=${DST1_POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
#      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/mnt

      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
#      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL}
      - WHISPER_BASEURL=${WHISPER_BASEURL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_BASEURL=${EVOLUTION_BASEURL}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - WA_GROUP_BOT_HOME=${WA_GROUP_BOT_HOME}
      - WA_GROUP_BOT_DAVID=${WA_GROUP_BOT_DAVID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - N8N_API_BASE=${N8N_API_BASE}
      - N8N_API_KEY=${N8N_API_KEY}

    volumes:
      - /volume/dst1-n8n/data:/home/node/.n8n
      - /volume/dst1-n8n/share:/mnt/share

  dst1-agent:
    build:
      context: /etc/docker/build/dst1-agent
    container_name: dst1-agent
    restart: unless-stopped
    depends_on:
      - dst1-postgres
      - dst1-n8n
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}

      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - POSTGRES_DSN=postgresql://${DST1_POSTGRES_USER}:${DST1_POSTGRES_PASSWORD}@${DST1_DB_POSTGRESDB_HOST}:5432/dst1_agent

      # --- Agent DST1 ---
      - AGENT_NAME=${AGENT_NAME}
      #- N8N_WEBHOOK_BASE=http://dst1-n8n:5678/webhook
      - AGENT_CONFIG_PATH=/app/agent_config.yaml
      #- TOOLS_CONFIG_PATH=/app/tools.yaml
      - N8N_WEBHOOK_BASE=${N8N_WEBHOOK_BASE}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_API_BASE=${N8N_API_BASE}
      - DST1_TOOL_TAG=${DST1_TOOL_TAG}
      - DST1_AGENT_TEXT_URL=http://dst1-agent:8090
 
    volumes:
      - /volume/dst1-agent:/app
      - /volume/dst1-logs:/app/logs

  dst1-web:
    build:
      context: /etc/docker/build/dst1-web
    container_name: dst1-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - AGENT_NAME=${AGENT_NAME}
    volumes:
      - /volume/dst1-web:/app
      - /volume/dst1-logs:/app/logs:ro

