  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER} 
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB}
    volumes:
      - /volume/evolution-postgres:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:latest 
    container_name: evolution-api
    restart: always
    ports:
      - "8089:8080"
    depends_on:
      - evolution-postgres
    environment:
      - SERVER_URL=${EVOLUTION_BASEURL}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Configuration de la base de données (hôte mis à jour vers evolution-postgres)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=${EVOLUTION_POSTGRES_DB}
      - CACHE_REDIS_ENABLED=false

      - CONFIG_SESSION_PHONE_CLIENT_NAME=Evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      # Activer la GUI intégrée :
      - EXPOSE_INBUILT_WEB_PANEL=true

  whatsapp-redis:
    image: redis:alpine
    container_name: whatsapp-redis
    restart: always
    ports:
      - "63790:6379"
    volumes:
      - /volume/whatsapp-redis/data:/data

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - WHISPER_MODEL=base   # Modèles dispos : tiny, base, small, medium, large-v3
      - WHISPER_DEVICE=cpu   # Remplacez par "cuda" si vous utilisez un GPU Nvidia

volumes:
  mnt-video:
    driver_opts:
      type: "nfs"
      o: "addr=10.42.42.1,nolock,soft,rw"
      device: ":/volume1/video"
  mnt-download:
    driver_opts:
      type: "nfs"
      o: "addr=10.42.42.1,nolock,soft,rw"
      device: ":/volume1/download"

  mnt-joal-torrents:
    driver_opts:
      type: "nfs"
      o: "addr=10.42.42.1,nolock,soft,rw"
      device: ":/volume1/download/qbittorrent/torrents"
